plugins {
    id 'java'
    id 'application'
}

group = 'loginauth'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // MariaDB JDBC 드라이버
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
    // JWT 라이브러리 추가
    implementation 'com.auth0:java-jwt:4.4.0'
    // 비밀번호 해시용 jBCrypt
    implementation 'org.mindrot:jbcrypt:0.4'
}

application {
    // main() 이 들어 있는 클래스 경로
    mainClass = 'loginauth.SimpleAuthServer'
}

// DbExample.java 예제 개별 실행을 위한 추가 설정
// 실행: gradle runDbExample

tasks.register('runDbExample', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'loginauth.DbExample'
}


/*
 * 외부 라이브러리까지 포함한 실행 가능한 Fat JAR 생성
 *
 * 일반 jar 파일에는 MariaDB JDBC 드라이버가 포함되지 않으므로
 * runtimeClasspath의 라이브러리를 모두 JAR 안에 포함합니다.
 */
tasks.named('jar') {

    // 생성되는 파일명: login-app.jar (build/libs에 생성)
    // 독립 배포용 파일 실행: java -jar login-auth.jar
    // 경로 확인용 예시: java -jar ./app/build/libs/login-auth.jar
    archiveBaseName = 'login-auth'
    archiveVersion = ''

    // java -jar 실행 시 시작할 Main 클래스 지정
    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }

    // 라이브러리 통합 과정에서 중복 파일 제외
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 실행에 필요한 외부 라이브러리를 JAR에 포함
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}