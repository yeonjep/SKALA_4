<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="login-container">

    <div class="login-header">

        <h1>Create Account</h1>

        <p>Spring Boot + JWT Cookie Authentication</p>

    </div>

    <form method="POST"
          action="/api/auth/signup"
          class="login-form">

        <div class="form-group">

            <label for="username">
                User ID
            </label>

            <input
                    id="username"
                    name="username"
                    type="text"
                    minlength="4"
                    maxlength="50"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    maxlength="100"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required>

        </div>

        <button
                type="submit"
                class="login-button">

            Create Account

        </button>

    </form>

    <div class="login-footer">

        <span>
            Already have an account?
        </span>

        <a href="/login">
            Sign In
        </a>

    </div>

</div>

</body>

</html>
