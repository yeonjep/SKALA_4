<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise Board</title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/x-icon"
          href="/favicon.ico?v=1">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/board.css">
</head>

<body>
<header class="board-header">
    <div>
        <p class="eyebrow">CONTENT SERVICE DEMO</p>
        <h1>Enterprise Board</h1>
        <p id="currentUser">인증 확인 중...</p>
    </div>

    <nav>
        <a class="secondary-link" href="/post-form.html">글쓰기</a>
        <button id="logout" type="button">로그아웃</button>
    </nav>
</header>

<main class="board-main">
    <section class="search-panel">
        <select id="searchType">
            <option value="titleContent">제목 + 내용</option>
            <option value="title">제목</option>
            <option value="content">내용</option>
            <option value="writer">작성자</option>
        </select>

        <input
                id="keyword"
                type="search"
                placeholder="검색어를 입력하세요">

        <select id="sort">
            <option value="latest">최신순</option>
            <option value="views">조회순</option>
        </select>

        <button id="searchButton" type="button">
            검색
        </button>
    </section>

    <section class="board-card">
        <table>
            <thead>
            <tr>
                <th class="id-column">번호</th>
                <th>제목</th>
                <th class="writer-column">작성자</th>
                <th class="count-column">조회</th>
                <th class="count-column">좋아요</th>
                <th class="count-column">댓글</th>
                <th class="date-column">작성일</th>
            </tr>
            </thead>

            <tbody id="postList"></tbody>
        </table>
    </section>

    <nav id="pagination" class="pagination"></nav>
</main>

<script src="/js/board.js"></script>
</body>
</html>
