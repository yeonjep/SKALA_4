<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <link rel="stylesheet" href="/css/board.css">
</head>
<body>
<header class="board-header">
    <div>
        <h1>Enterprise Board</h1>
        <p>Spring Boot 계층형 아키텍처 게시판</p>
    </div>
    <nav>
        <a href="/home.html">Home</a>
        <button id="logout" type="button">Logout</button>
    </nav>
</header>

<main class="board-main">
    <section class="board-toolbar">
        <div>
            <h2>게시글 목록</h2>
            <p id="currentUser">사용자 확인 중...</p>
        </div>
        <a class="primary-link" href="/post-form.html">글쓰기</a>
    </section>

    <section class="board-card">
        <table>
            <thead>
            <tr>
                <th class="id-column">번호</th>
                <th>제목</th>
                <th class="writer-column">작성자</th>
                <th class="date-column">작성일</th>
            </tr>
            </thead>
            <tbody id="postList">
            <tr><td colspan="4" class="empty-row">게시글을 불러오는 중입니다.</td></tr>
            </tbody>
        </table>
    </section>

    <p id="message" class="message"></p>
</main>

<script src="/js/board.js"></script>
</body>
</html>
