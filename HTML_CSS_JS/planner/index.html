<!doctype html>
<!-- 문서 언어를 한국어로 지정 -->
<html lang="ko">
  <head>
    <!-- 한글 깨짐 방지 -->
    <meta charset="UTF-8" />
    <!-- 모바일에서 화면이 축소 방지-->   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKALA 스터디 플래너</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 상단 헤더: 로고, 오늘 날짜, 다크모드 스위치 -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">SKALA 스터디 플래너</h1>
        <!-- 날짜는 JS에서 -->
        <p class="today" id="today"></p>
      </div>
      <div class="theme-switch-wrap">
        <span class="theme-switch-label">다크모드</span>
        <label class="theme-switch">
          <input type="checkbox" id="theme-toggle" />
          <span class="theme-switch-slider"></span>
        </label>
      </div>
    </header>

    <main class="container">
      <!-- 1. 목표 추가 폼 -->
      <section class="panel">
        <h2 class="panel-title">학습 목표 추가</h2>
        <form id="goal-form" class="goal-form">
          <div class="form-row">
            <!-- placeholder는 label 대체 아니라서 sr-only로 라벨 따로 둠 -->
            <label for="goal-title" class="sr-only">목표 제목</label>
            <input
              type="text"
              id="goal-title"
              class="form-input"
              placeholder="오늘의 학습 목표를 입력하세요"
              autocomplete="off"
              required
            />

            <!-- HTML/CSS/JS 값 : 분류별 요약 집계 기준 -->
            <label for="goal-category" class="sr-only">분류</label>
            <select id="goal-category" class="form-input form-select">
              <option value="HTML">HTML</option>
              <option value="CSS">CSS</option>
              <option value="JS">JS</option>
            </select>

            <label for="goal-due" class="sr-only">마감일</label>
            <input
              type="date"
              id="goal-due"
              class="form-input form-date"
              required
            />

            <button type="submit" class="btn btn-primary">추가</button>
          </div>
        </form>
      </section>

      <!-- 2. 목표 목록 -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">학습 목록</h2>
          <!-- data-filter 값으로 이벤트 위임 처리 -->
          <div class="tabs" id="filter-tabs">
            <button type="button" class="tab is-active" data-filter="all">
              전체
            </button>
            <button type="button" class="tab" data-filter="active">
              진행중
            </button>
            <button type="button" class="tab" data-filter="done">완료</button>
          </div>
        </div>

        <!-- 입력할 때마다 실시간 필터링 -->
        <div class="search-row">
          <label for="goal-search" class="sr-only">목표 검색</label>
          <input
            type="text"
            id="goal-search"
            class="form-input"
            placeholder="목표 검색하기"
            autocomplete="off"
          />
        </div>

        <!-- data-sort 값 기준 정렬 -->
        <div class="sort-row" id="sort-controls">
          <span class="sort-label">정렬</span>
          <button type="button" class="sort-btn is-active" data-sort="default">
            기본
          </button>
          <button type="button" class="sort-btn" data-sort="due">
            마감임박순
          </button>
          <button type="button" class="sort-btn" data-sort="latest">
            최신순
          </button>
        </div>

        <!-- 목표 목록 : render() -->
        <ul id="goal-list" class="goal-list"></ul>

        <!-- 목록 비었을 때만 JS가 hidden 제거해서 보여줌 -->
        <div class="list-empty" id="list-empty" hidden>
          <p class="list-empty-title">아직 등록된 목표가 없어요.</p>
          <p class="list-empty-desc">예: "HTML 시맨틱 태그 복습하기"</p>
        </div>

        <!-- 진행률 %  -->
        <div class="progress">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="progress-text" id="progress-text">0 / 0 완료 (0%)</p>
        </div>

        <!-- 분류별 남은 개수 요약 -->
        <p class="summary" id="category-summary"></p>
      </section>

      <!-- 3. 오늘의 팁: fetch로 data/tips.json 읽어서 3개를 슬라이드로 표시 -->
      <section class="panel">
        <h2 class="panel-title">오늘의 팁</h2>
        <div class="tip-slider">
          <div class="tip-track" id="tip-track"></div>
          <div class="tip-dots" id="tip-dots"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 SKALA 스터디 플래너</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
